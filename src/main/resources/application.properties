# Para desarrollo local
app.cors.allowed-origins=http://localhost:4200, http://127.0.0.1:4200
server.port=9090
server.servlet.context-path=/system-votaciones-sds

spring.datasource.url=jdbc:postgresql://localhost:5480/votaciones_sds
# spring.datasource.username=admin
spring.datasource.username=${DB_USERNAME}
# spring.datasource.password=Admin123*
spring.datasource.password=${DB_PASSWORD}

security.jwt.secret-key=${JWT_SECRET}
# security.jwt.secret-key=ChangeThisInProd012345678901234567890
# 15 minutes
# security.jwt.expiration=900000
# 2 minutos
security.jwt.expiration=120000
# 7 days (milliseconds)
#security.refresh-token.expiration-time=604800000
# 4 minutos
security.refresh-token.expiration-time=240000
# Cookie HttpOnly del refresh token. En despliegues cross-site debe usar Secure y SameSite=None.
security.refresh-cookie.name=${REFRESH_COOKIE_NAME:refresh_token}
security.refresh-cookie.secure=${REFRESH_COOKIE_SECURE:true}
# security.refresh-cookie.secure=${REFRESH_COOKIE_SECURE:false}
# security.refresh-cookie.same-site=${REFRESH_COOKIE_SAME_SITE:None}
security.refresh-cookie.same-site=${REFRESH_COOKIE_SAME_SITE:Strict}
# Sesiones (alineadas al refresh token por defecto)
security.session.expiration-time=${security.refresh-token.expiration-time}
# Retención: máximo de filas recientes por usuario (almacenamiento limitado)
security.retention.max-user-sessions=3
security.retention.max-login-audits=3

# pasarlo a false para producción.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# actualizar a 'validate' para produccion.
spring.jpa.hibernate.ddl-auto=validate
# spring.jpa.hibernate.ddl-auto=update

spring.devtools.restart.enabled=true